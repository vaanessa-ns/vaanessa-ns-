<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vfinance — Gestão Financeira & Inteligência</title>
    <meta name="description" content="Vfinance — Aplicativo moderno de organização e controle financeiro pessoal." />
    <meta property="og:title" content="Vfinance — Gestão Financeira & Inteligência" />
    <meta property="og:description" content="Vfinance — Aplicativo moderno de organização e controle financeiro pessoal." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      window.addEventListener('unhandledrejection', function (e) {
        if (e.reason && (String(e.reason).includes('WebSocket') || String(e.reason.message || '').includes('WebSocket'))) {
          e.preventDefault();
        }
      });
      (function() {
        try {
          var stored = localStorage.getItem('theme');
          var userRaw = localStorage.getItem('vfinance_user');
          var isDark = true;
          if (stored === 'light') {
            isDark = false;
          } else if (stored === 'dark') {
            isDark = true;
          } else if (userRaw) {
            var parsed = JSON.parse(userRaw);
            if (parsed && parsed.themeMode === 'light') {
              isDark = false;
            }
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
